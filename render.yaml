# Render blueprint for the Face Liveness API.
#
# IMPORTANT — instance size:
# Measured peak RSS on this model is ~960 MB (CPU, batch 16) and remains well
# above 512 MB even with the reduced default batch size. Render's free/starter
# 512 MB instances WILL be OOM-killed. Use a Standard (2 GB) instance or larger.
#
# This file is at the repository root, so Render's Blueprint flow detects it
# automatically. `rootDir` below sets the working directory for both the build
# and the start command to services/face-liveness-api/.
#
# Model weights: the two checkpoints are committed to this repo at
# services/face-liveness-api/models/ (EfficientNet_B2.pt and
# ABC_BiLSTM_Undercomplete_AE.pt). Nothing is downloaded at build time.
services:
  - type: web
    name: face-liveness-api
    runtime: python
    plan: standard # >= 2 GB RAM required (see note above)
    rootDir: services/face-liveness-api

    # /health is a plain process-liveness probe that returns 200 even if the
    # model failed to load. /ready returns 503 until both checkpoints are
    # loaded, so using it here means a deploy with a broken model is reported
    # as failed instead of silently going green.
    # Trade-off: Render must tolerate a 503 for ~10 s while the model loads,
    # which it does — health checks are retried for up to 15 minutes before a
    # new deploy is cancelled. See docs/RENDER.md.
    healthCheckPath: /ready

    # Verifies the committed checkpoints are present; fails loudly if absent.
    # No download step — the weights ship with the repository.
    buildCommand: >
      pip install --no-cache-dir -r requirements.txt
      && python scripts/fetch_models.py

    # --ws-ping-timeout 60 (interval left at uvicorn's 20 s default):
    # websockets closes the connection with code 1011 and the reason
    # "keepalive ping timeout" when a Pong is not processed within
    # `ws_ping_timeout` — and it logs nothing at `--log-level info`, so the
    # server looked healthy while the browser reported
    # "Connection closed (code 1011)". A single lost or delayed pong must not
    # destroy a verification that is seconds from completing (inference alone
    # is ~43 s on CPU), so only the pong deadline is relaxed; the 20 s
    # interval still detects a genuinely dead peer within ~80 s, and the
    # every-5 s `progress` frames plus the always-reading receive loop give a
    # faster and better-logged liveness signal anyway.
    # Pinned explicitly so local runs and production share one policy and a
    # regression is visible in tests/test_real_transport.py rather than as an
    # outage. See docs/TROUBLESHOOTING.md ("close code 1011").
    startCommand: >
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --workers 1 --log-level info --ws-ping-timeout 60

    envVars:
      # Single worker: sessions are in-memory, so multiple workers would break
      # session affinity. Scale vertically instead.
      - key: LIVENESS_DEVICE
        value: cpu
      - key: LIVENESS_BATCH_SIZE
        value: "8"
      # Checkpoint directory. `models` is relative to SERVICE_ROOT
      # (services/face-liveness-api/), which app/paths.py anchors to the
      # package location rather than to the process cwd — so the build step
      # and the running API resolve the identical absolute path.
      # Leave as-is unless you relocate the weights.
      - key: LIVENESS_MODELS_DIR
        value: models
      # Exact browser origins allowed to call the API cross-origin.
      # Comma-separated (see app/config.py `_csv`: split on ",", items stripped).
      # This is an ORIGIN only — scheme + host, no path, no trailing slash.
      #
      # These two values are the deployed LIVENOX frontends:
      #   https://face-liveness-platform.vercel.app          (public, serves the app)
      #   https://face-liveness-platform-5iupvthd2.vercel.app (second deployment)
      #
      # Evidence for why this must be exact: with the previous placeholder
      # value the deployed API answered GET /health from either origin with
      # NO `Access-Control-Allow-Origin` header and answered the preflight
      # for POST /sessions with HTTP 400 "Disallowed CORS origin" (Starlette's
      # CORSMiddleware rejection). The browser therefore failed the health
      # fetch (UI: "Service offline") and the session-creation fetch (UI:
      # "Could not reach the liveness service") even though the API was
      # healthy (GET /ready -> ready:true). See docs/TROUBLESHOOTING.md.
      #
      # Keep this value in sync with the Render dashboard environment: a
      # blueprint sync overwrites manual dashboard edits with this file.
      - key: LIVENESS_ALLOWED_ORIGINS
        value: https://face-liveness-platform.vercel.app,https://face-liveness-platform-5iupvthd2.vercel.app
      - key: LOG_LEVEL
        value: info
